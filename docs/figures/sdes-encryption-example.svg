<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">S-DES 加密算法示例</title>
  <desc id="desc">展示明文 10010111 使用密钥 1010000010 进行密钥生成、初始置换、两轮 Feistel 运算、交换和最终置换，得到密文 00111000。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52617c"/>
    </marker>
    <marker id="key-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6be8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #1b2942; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; letter-spacing: 1px; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
      .section-title { font-size: 23px; font-weight: 700; }
      .label { font-size: 16px; fill: #65748d; }
      .value { font-size: 24px; fill: #243fbd; }
      .small-value { font-size: 19px; fill: #243fbd; }
      .stage-title { font-size: 20px; font-weight: 700; }
      .note { font-size: 15px; fill: #697791; }
      .arrow { stroke: #52617c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .key-arrow { stroke: #8b6be8; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#key-arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="#f4f6fb"/>
  <rect x="0" y="0" width="1600" height="12" rx="6" fill="#3d5be5"/>

  <text x="64" y="77" font-size="34" font-weight="800">S-DES 加密：从明文到密文</text>
  <text x="64" y="111" font-size="17" fill="#65748d">用一组完整输入展示子密钥生成与两轮加密的每个关键中间状态</text>
  <rect x="1194" y="48" width="342" height="48" rx="24" fill="#e7ebff"/>
  <text x="1365" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#344dc3">8-bit 分组 · 10-bit 主密钥 · 2 轮</text>

  <!-- Key schedule -->
  <rect x="48" y="145" width="1504" height="286" rx="22" fill="#f0edff" stroke="#ddd6ff" stroke-width="2"/>
  <circle cx="82" cy="181" r="15" fill="#8062de"/>
  <text x="82" y="187" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">1</text>
  <text x="109" y="189" class="section-title">密钥调度：由主密钥生成 K1、K2</text>
  <text x="1499" y="187" text-anchor="end" class="note">P10 → 分成左右 5 bit → 循环左移 → P8</text>

  <rect x="76" y="220" width="210" height="142" rx="16" fill="#ffffff" stroke="#d8dff1" stroke-width="2"/>
  <text x="96" y="251" class="label">主密钥 K</text>
  <text x="96" y="294" class="mono value">1010000010</text>
  <text x="96" y="332" class="note">10 bit</text>

  <path d="M292 291 H352" class="key-arrow"/>
  <rect x="360" y="220" width="238" height="142" rx="16" fill="#ffffff" stroke="#d8dff1" stroke-width="2"/>
  <text x="382" y="251" class="label">P10 置换</text>
  <text x="382" y="294" class="mono value">1000001100</text>
  <text x="382" y="332" class="note">分组：10000 │ 01100</text>

  <path d="M604 291 H662 V257 H714" class="key-arrow"/>
  <path d="M662 291 V352 H714" class="key-arrow"/>
  <rect x="722" y="221" width="331" height="72" rx="14" fill="#ffffff" stroke="#cfc4ff" stroke-width="2"/>
  <rect x="742" y="237" width="56" height="38" rx="12" fill="#eee9ff"/>
  <text x="770" y="262" text-anchor="middle" class="mono small-value" fill="#6848c7">K1</text>
  <text x="818" y="247" font-size="16" fill="#65748d">左右各循环左移 1 位，再做 P8</text>
  <text x="818" y="274" class="mono small-value">10100100</text>

  <rect x="722" y="316" width="331" height="72" rx="14" fill="#ffffff" stroke="#cfc4ff" stroke-width="2"/>
  <rect x="742" y="332" width="56" height="38" rx="12" fill="#eee9ff"/>
  <text x="770" y="357" text-anchor="middle" class="mono small-value" fill="#6848c7">K2</text>
  <text x="818" y="342" font-size="15" fill="#65748d">基于 K1 再左移 2 位，随后做 P8</text>
  <text x="818" y="369" class="mono small-value">01000011</text>

  <rect x="1101" y="220" width="421" height="168" rx="16" fill="#e7e1ff"/>
  <text x="1127" y="254" class="eyebrow" fill="#6848c7">本例子密钥</text>
  <text x="1127" y="292" font-size="17" fill="#4f5c76">P10(K) =</text>
  <text x="1230" y="292" class="mono small-value">1000001100</text>
  <text x="1127" y="329" font-size="17" fill="#4f5c76">K1 =</text>
  <text x="1185" y="329" class="mono small-value">10100100</text>
  <text x="1340" y="329" font-size="17" fill="#4f5c76">K2 =</text>
  <text x="1397" y="329" class="mono small-value">01000011</text>
  <text x="1127" y="365" class="note">两个子密钥分别用于第 1 轮和第 2 轮</text>

  <!-- Main encryption pipeline -->
  <rect x="48" y="458" width="1504" height="497" rx="22" fill="#ffffff" stroke="#dce3f1" stroke-width="2"/>
  <circle cx="82" cy="495" r="15" fill="#3d5be5"/>
  <text x="82" y="501" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
  <text x="109" y="503" class="section-title">加密流程：置换 → 两轮运算 → 最终置换</text>
  <text x="1499" y="500" text-anchor="end" class="note">每个方框列出该阶段可以手算核对的状态</text>

  <!-- Dashed subkey guides -->
  <path d="M889 294 V418 H691 V556" class="key-arrow"/>
  <path d="M954 389 V431 H1141 V556" class="key-arrow"/>
  <rect x="643" y="508" width="96" height="30" rx="15" fill="#eee9ff"/>
  <text x="691" y="529" text-anchor="middle" font-size="15" font-weight="700" fill="#6848c7">K1 输入</text>
  <rect x="1093" y="508" width="96" height="30" rx="15" fill="#eee9ff"/>
  <text x="1141" y="529" text-anchor="middle" font-size="15" font-weight="700" fill="#6848c7">K2 输入</text>

  <!-- stage arrows -->
  <path d="M231 699 H255" class="arrow"/>
  <path d="M451 699 H475" class="arrow"/>
  <path d="M751 699 H775" class="arrow"/>
  <path d="M931 699 H955" class="arrow"/>
  <path d="M1231 699 H1255" class="arrow"/>

  <!-- Plaintext -->
  <rect x="76" y="563" width="155" height="272" rx="16" fill="#f7f9ff" stroke="#cbd7f2" stroke-width="2"/>
  <rect x="76" y="563" width="155" height="10" rx="5" fill="#4d6be8"/>
  <text x="96" y="611" class="eyebrow" fill="#3d5be5">输入</text>
  <text x="96" y="651" class="stage-title">明文 P</text>
  <text x="96" y="700" class="mono small-value">10010111</text>
  <text x="96" y="758" class="label">8 bit</text>
  <text x="96" y="793" class="note">待加密分组</text>

  <!-- IP -->
  <rect x="263" y="563" width="188" height="272" rx="16" fill="#f7f9ff" stroke="#cbd7f2" stroke-width="2"/>
  <rect x="263" y="563" width="188" height="10" rx="5" fill="#4d6be8"/>
  <text x="283" y="611" class="eyebrow" fill="#3d5be5">初始置换</text>
  <text x="283" y="651" class="stage-title">IP(P)</text>
  <text x="283" y="700" class="mono small-value">01011101</text>
  <line x1="283" y1="720" x2="431" y2="720" stroke="#dbe2f1" stroke-width="2"/>
  <text x="283" y="757" class="label">L0</text>
  <text x="326" y="757" class="mono small-value">0101</text>
  <text x="283" y="795" class="label">R0</text>
  <text x="326" y="795" class="mono small-value">1101</text>

  <!-- Round 1 -->
  <rect x="483" y="563" width="268" height="272" rx="16" fill="#eef9f4" stroke="#a9ddc9" stroke-width="2"/>
  <rect x="483" y="563" width="268" height="10" rx="5" fill="#20a477"/>
  <text x="503" y="611" class="eyebrow" fill="#16825e">第 1 轮</text>
  <text x="503" y="651" class="stage-title">fK1(L0, R0)</text>
  <rect x="503" y="671" width="228" height="45" rx="10" fill="#ffffff"/>
  <text x="519" y="700" font-size="16" fill="#65748d">F(R0, K1)</text>
  <text x="712" y="700" text-anchor="end" class="mono small-value">1111</text>
  <text x="503" y="750" font-size="16" fill="#65748d">L0 ⊕ F =</text>
  <text x="712" y="750" text-anchor="end" class="mono small-value">1010</text>
  <text x="503" y="793" class="label">输出 L1 │ R1</text>
  <text x="503" y="821" class="mono small-value">1010 │ 1101</text>

  <!-- Swap -->
  <rect x="783" y="563" width="148" height="272" rx="16" fill="#fff8e9" stroke="#f0d498" stroke-width="2"/>
  <rect x="783" y="563" width="148" height="10" rx="5" fill="#e6a622"/>
  <text x="803" y="611" class="eyebrow" fill="#a9740c">轮间交换</text>
  <text x="803" y="651" class="stage-title">SW</text>
  <text x="803" y="692" class="label">交换左右 4 bit</text>
  <text x="803" y="744" class="label">R1 │ L1</text>
  <text x="803" y="781" class="mono small-value">1101 │ 1010</text>
  <text x="803" y="817" class="note">作为第 2 轮输入</text>

  <!-- Round 2 -->
  <rect x="963" y="563" width="268" height="272" rx="16" fill="#eef9f4" stroke="#a9ddc9" stroke-width="2"/>
  <rect x="963" y="563" width="268" height="10" rx="5" fill="#20a477"/>
  <text x="983" y="611" class="eyebrow" fill="#16825e">第 2 轮</text>
  <text x="983" y="651" class="stage-title">fK2(R1, L1)</text>
  <rect x="983" y="671" width="228" height="45" rx="10" fill="#ffffff"/>
  <text x="999" y="700" font-size="16" fill="#65748d">F(L1, K2)</text>
  <text x="1192" y="700" text-anchor="end" class="mono small-value">1111</text>
  <text x="983" y="750" font-size="16" fill="#65748d">R1 ⊕ F =</text>
  <text x="1192" y="750" text-anchor="end" class="mono small-value">0010</text>
  <text x="983" y="793" class="label">输出 L2 │ R2</text>
  <text x="983" y="821" class="mono small-value">0010 │ 1010</text>

  <!-- Final permutation -->
  <rect x="1263" y="563" width="249" height="272" rx="16" fill="#fff1f1" stroke="#efc1c1" stroke-width="2"/>
  <rect x="1263" y="563" width="249" height="10" rx="5" fill="#df5d68"/>
  <text x="1283" y="611" class="eyebrow" fill="#bc4653">输出</text>
  <text x="1283" y="651" class="stage-title">最终置换 IP⁻¹</text>
  <text x="1283" y="693" class="label">IP⁻¹(00101010)</text>
  <text x="1283" y="751" class="label">密文 C</text>
  <text x="1283" y="790" class="mono value">00111000</text>
  <rect x="1283" y="803" width="91" height="24" rx="12" fill="#ffe0e2"/>
  <text x="1328" y="821" text-anchor="middle" font-size="15" font-weight="700" fill="#a53542">hex 38</text>

  <rect x="76" y="868" width="1436" height="56" rx="14" fill="#f1f4fa"/>
  <text x="100" y="903" font-size="17" fill="#53617a">轮函数：</text>
  <text x="180" y="903" class="mono" font-size="17" fill="#344dc3">fK(L, R) = (L ⊕ F(R, K), R)</text>
  <text x="664" y="903" font-size="17" fill="#53617a">结果：</text>
  <text x="727" y="903" class="mono" font-size="17" fill="#16825e">P = 10010111  →  C = 00111000 (38)</text>
  <text x="1493" y="986" text-anchor="end" font-size="14" fill="#77849a">注：SBox2 按本作业指定表取值，与标准 S-DES 的 S1 不同。</text>
</svg>
